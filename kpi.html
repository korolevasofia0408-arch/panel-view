<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CARS&amp;GO · Показатели</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --card-border:    rgba(11,11,11,0.08);

    --accent:   #2a78d6;
    --accent-wash: rgba(42,120,214,0.10);
    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;
    --good-wash:     rgba(12,163,12,0.12);
    --critical-wash: rgba(208,59,59,0.12);
    --chip-bg: #f2f1ec;
    --chip-bg-hover: #ebe9e2;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --card-border:    rgba(255,255,255,0.08);
      --accent:   #3987e5;
      --accent-wash: rgba(57,135,229,0.14);
      --good:     #0ca30c;
      --warning:  #fab219;
      --critical: #e66767;
      --good-wash:     rgba(12,163,12,0.18);
      --critical-wash: rgba(230,103,103,0.16);
      --chip-bg: #232322;
      --chip-bg-hover: #2b2b29;
      --input-bg: #141413;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --card-border:    rgba(255,255,255,0.08);
    --accent:   #3987e5;
    --accent-wash: rgba(57,135,229,0.14);
    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #e66767;
    --good-wash:     rgba(12,163,12,0.18);
    --critical-wash: rgba(230,103,103,0.16);
    --chip-bg: #232322;
    --chip-bg-hover: #2b2b29;
    --input-bg: #141413;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--page-plane); color:var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 64px; }

  header.top{ display:flex; flex-direction:column; gap:4px; margin-bottom:20px; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); }
  h1{ font-size:26px; font-weight:700; margin:2px 0 0; letter-spacing:-0.01em; }
  .subtitle{ font-size:13.5px; color:var(--text-secondary); margin-top:2px; }

  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--surface-1); border:1px solid var(--card-border);
    border-radius:12px; padding:12px 14px; margin-bottom:20px;
  }
  .month-nav{ display:flex; align-items:center; gap:8px; }
  .month-nav button{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--card-border);
    background:var(--input-bg); color:var(--text-primary); cursor:pointer; font-size:14px;
  }
  .month-nav button:hover{ background:var(--chip-bg-hover); }
  .month-label{ font-size:14px; font-weight:700; min-width:150px; text-align:center; }
  .sep{ width:1px; align-self:stretch; background:var(--gridline); }
  .chip{
    font: inherit; font-size:12px; color:var(--text-secondary);
    background:var(--chip-bg); border:1px solid transparent;
    border-radius:20px; padding:5px 12px; cursor:pointer;
  }
  .chip:hover{ background:var(--chip-bg-hover); }
  .chip.active{ background:var(--accent-wash); color:var(--accent); font-weight:600; }
  .chips-row{ display:flex; flex-wrap:wrap; gap:6px; }

  .card{
    background:var(--surface-1); border:1px solid var(--card-border); border-radius:14px;
    padding:8px 20px; margin-bottom:16px;
  }
  .card h2{ font-size:14.5px; font-weight:700; margin:16px 0 2px; padding:0 0 10px; border-bottom:1px solid var(--gridline); }
  .card h2:first-child{ margin-top:12px; }

  .metric-row{ border-bottom:1px solid var(--gridline); }
  .metric-row:last-child{ border-bottom:none; }
  .metric-head{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding:13px 2px; }
  .metric-head.clickable{ cursor:pointer; }
  .metric-head.clickable:hover{ background:var(--chip-bg-hover); border-radius:8px; }
  .metric-name{ flex:0 0 200px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .metric-name .chevron{ font-size:10px; color:var(--text-muted); }
  .metric-figures{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; flex:1; }
  .mf{ display:flex; flex-direction:column; min-width:64px; }
  .mf-label{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); }
  .mf-value{ font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .mf-value.muted{ color:var(--text-secondary); font-weight:600; }
  .mini-meter{ position:relative; width:90px; height:8px; border-radius:4px; background:var(--gridline); flex:none; }
  .mini-meter-fill{ position:absolute; left:0; top:0; height:100%; border-radius:4px; background:var(--accent); }
  .mini-meter-pace{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text-primary); }
  .deltas{ display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .delta-badge{
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .delta-badge.good{ background:var(--good-wash); color:var(--good); }
  .delta-badge.bad{ background:var(--critical-wash); color:var(--critical); }
  .delta-badge.flat{ background:var(--chip-bg); color:var(--text-secondary); }
  .delta-badge.muted{ background:var(--chip-bg); color:var(--text-muted); font-weight:500; }

  .metric-detail{ padding:2px 2px 16px 214px; }
  .detail-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .detail-table td{ padding:5px 10px 5px 0; color:var(--text-secondary); }
  .detail-table td.dt-name{ color:var(--text-primary); }
  .detail-table td.dt-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .detail-table tr{ border-bottom:1px solid var(--gridline); }
  .detail-table tr:last-child{ border-bottom:none; }
  .detail-bar-track{ height:6px; border-radius:3px; background:var(--gridline); overflow:hidden; width:100px; display:inline-block; vertical-align:middle; }
  .detail-bar-fill{ height:100%; background:var(--accent); }

  .empty-note{ font-size:12.5px; color:var(--text-muted); padding:18px 0; text-align:center; }
  footer.caveats{
    font-size:12px; color:var(--text-muted); border-top:1px solid var(--gridline);
    padding-top:14px; line-height:1.7; margin-top:8px;
  }
  footer.caveats b{ color:var(--text-secondary); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">CARS&amp;GO · Показатели</div>
    <h1>Основные и дополнительные КПЭ</h1>
    <div class="subtitle" id="subtitle">Загрузка…</div>
  </header>

  <div class="toolbar">
    <div class="month-nav">
      <button id="prevMonth" aria-label="Предыдущий месяц">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth" aria-label="Следующий месяц">›</button>
    </div>
    <div class="sep"></div>
    <div class="chips-row" id="cityChips"></div>
  </div>

  <section class="card" id="mainCard">
    <h2>Основные показатели</h2>
    <div id="mainMetrics"></div>
  </section>

  <section class="card" id="extraCard">
    <h2>Дополнительные показатели</h2>
    <div id="extraMetrics"></div>
  </section>

  <footer class="caveats" id="caveats"></footer>
</div>

<script>
const fmtRub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fmtRubShort = n => {
  const a = Math.abs(n);
  if(a >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + ' млн ₽';
  if(a >= 1e3) return Math.round(n/1e3) + ' тыс ₽';
  return Math.round(n) + ' ₽';
};
const fmtNum = n => Math.round(n).toLocaleString('ru-RU');
const fmtPctVal = n => isFinite(n) ? n.toFixed(1) + '%' : '—';
function fmtByUnit(v, unit){
  if(v===null || v===undefined || !isFinite(v)) return '—';
  if(unit==='currency') return fmtRubShort(v);
  if(unit==='percent') return fmtPctVal(v);
  return fmtNum(v);
}

let DATA = null;
let MIN_DATE = null;
const dateFromDay = d => { const dt = new Date(MIN_DATE); dt.setDate(dt.getDate() + d); return dt; };

const state = { year:null, month:null, cities:null, expanded:new Set() };

// Same company revenue plan used by the Пульс dashboard (0-based month, Apr..Aug 2026) --
// kept in sync manually if the company issues new monthly targets.
const MANUAL_PLAN = {
  'Москва':        {'2026-3':4544700, '2026-4':5701300, '2026-5':6416800, '2026-6':7213750, '2026-7':7599900},
  'Новосибирск':   {'2026-3':5972600, '2026-4':7949800, '2026-5':9328800, '2026-6':10003550, '2026-7':10102300},
  'Екатеринбург':  {'2026-3':7766000, '2026-4':8382500, '2026-5':9520400, '2026-6':9187400, '2026-7':9807100},
  'Тюмень':        {'2026-3':3078100, '2026-4':3646900, '2026-5':3356300, '2026-6':3276300, '2026-7':3133500},
  'Красноярск':    {'2026-3':3323300, '2026-4':4110100, '2026-5':5068800, '2026-6':5337750, '2026-7':5616050},
  'Иркутск':       {'2026-3':3535000, '2026-4':4503500, '2026-5':5205000, '2026-6':5110000, '2026-7':6149000},
};
function manualRevenuePlan(year, month, citySet){
  let sum = 0, any = false;
  DATA.cities.forEach((city, idx) => {
    if(!citySet.has(idx)) return;
    const v = MANUAL_PLAN[city] && MANUAL_PLAN[city][year+'-'+month];
    if(v !== undefined){ sum += v; any = true; }
  });
  return any ? sum : null;
}

function periodBounds(year, month){
  const start = new Date(year, month, 1);
  const end = new Date(year, month+1, 0);
  return {start, end, days: end.getDate()};
}
function shiftYM(year, month, delta){
  let m = month + delta, y = year;
  while(m < 0){ m += 12; y--; }
  while(m > 11){ m -= 12; y++; }
  return {year:y, month:m};
}
function monthKey(year, month){ return year + '-' + String(month+1).padStart(2,'0'); }
function monthLabel(y,m){
  const d = new Date(y,m,1);
  const l = d.toLocaleDateString('ru-RU', {month:'long', year:'numeric'});
  return l.charAt(0).toUpperCase()+l.slice(1);
}
function elapsedFraction(year, month){
  const today = new Date(); today.setHours(0,0,0,0);
  const {start, end, days} = periodBounds(year, month);
  if(today < start) return 0;
  if(today > end) return 1;
  return (Math.round((today-start)/86400000) + 1) / days;
}
function selectedCityIndices(){
  return new Set(DATA.cities.map((_,i)=>i).filter(i => state.cities.has(i)));
}

// ---------- core aggregators (all city-filtered, optional isRepeat filter: null|0|1) ----------
function bookingsPickupInPeriod(year, month, citySet, repeatFilter){
  const {start,end} = periodBounds(year,month);
  let count=0, revenue=0;
  for(const [created,pickup,ret,cityIdx,price,isRepeat] of DATA.bookings){
    if(!citySet.has(cityIdx)) continue;
    if(repeatFilter!==null && isRepeat!==repeatFilter) continue;
    const pd = dateFromDay(pickup);
    if(pd < start || pd > end) continue;
    count++; revenue += price;
  }
  return {count, revenue};
}
function bookingsCreatedInPeriod(year, month, citySet, repeatFilter){
  const {start,end} = periodBounds(year,month);
  let count=0, revenue=0;
  for(const [created,pickup,ret,cityIdx,price,isRepeat] of DATA.bookings){
    if(!citySet.has(cityIdx)) continue;
    if(repeatFilter!==null && isRepeat!==repeatFilter) continue;
    const cd = dateFromDay(created);
    if(cd < start || cd > end) continue;
    count++; revenue += price;
  }
  return {count, revenue};
}
function bookingsAlreadyBooked(year, month, citySet, repeatFilter){
  const {start,end} = periodBounds(year,month);
  let count=0, revenue=0;
  for(const [created,pickup,ret,cityIdx,price,isRepeat] of DATA.bookings){
    if(!citySet.has(cityIdx)) continue;
    if(repeatFilter!==null && isRepeat!==repeatFilter) continue;
    const pd = dateFromDay(pickup), cd = dateFromDay(created);
    if(pd < start || pd > end) continue;
    if(cd >= start) continue;
    count++; revenue += price;
  }
  return {count, revenue};
}
function bookingsFuture(year, month, citySet, repeatFilter){
  const {start,end} = periodBounds(year,month);
  let count=0, revenue=0;
  for(const [created,pickup,ret,cityIdx,price,isRepeat] of DATA.bookings){
    if(!citySet.has(cityIdx)) continue;
    if(repeatFilter!==null && isRepeat!==repeatFilter) continue;
    const cd = dateFromDay(created);
    if(cd < start || cd > end) continue;
    const pd = dateFromDay(pickup);
    if(pd <= end) continue;
    count++; revenue += price;
  }
  return {count, revenue};
}
function proratedRevenue(year, month, citySet, repeatFilter){
  const {start,end} = periodBounds(year,month);
  let revenue = 0;
  for(const [created,pickup,ret,cityIdx,price,isRepeat] of DATA.bookings){
    if(!citySet.has(cityIdx)) continue;
    if(repeatFilter!==null && isRepeat!==repeatFilter) continue;
    const pd = dateFromDay(pickup), rd = dateFromDay(ret);
    if(rd < start || pd > end) continue;
    const overlapStart = pd > start ? pd : start;
    const overlapEnd = rd < end ? rd : end;
    const overlapDays = Math.round((overlapEnd-overlapStart)/86400000) + 1;
    const totalDays = Math.round((rd-pd)/86400000) + 1;
    revenue += price * overlapDays / Math.max(1,totalDays);
  }
  return revenue;
}
function cancellationsInPeriod(year, month, citySet, repeatFilter){
  const {start,end} = periodBounds(year,month);
  let count=0, revenue=0;
  for(const [cancelDay,createdDay,cityIdx,price,isRepeat] of DATA.cancellations){
    if(!citySet.has(cityIdx)) continue;
    if(repeatFilter!==null && isRepeat!==repeatFilter) continue;
    const cd = dateFromDay(cancelDay);
    if(cd < start || cd > end) continue;
    count++; revenue += price;
  }
  return {count, revenue};
}
function leadsInPeriod(year, month, citySet){
  const {start,end} = periodBounds(year,month);
  const bySource = new Map();
  let total = 0;
  for(const [day,cityIdx,sourceIdx] of DATA.leads){
    if(!citySet.has(cityIdx)) continue;
    const d = dateFromDay(day);
    if(d < start || d > end) continue;
    total++;
    bySource.set(sourceIdx, (bySource.get(sourceIdx)||0) + 1);
  }
  return {total, bySource};
}
function prodlenieInPeriod(year, month, citySet){
  const key = monthKey(year,month);
  let sum = 0, any = false;
  DATA.cities.forEach((city, idx) => {
    if(!citySet.has(idx)) return;
    const v = DATA.prodlenie[city] && DATA.prodlenie[city][key];
    if(v !== undefined){ sum += v; any = true; }
  });
  return any ? sum : null;
}
function paidChannelStats(year, month, citySet){
  const key = monthKey(year,month);
  let spend=0, leads=0, bookings=0, any=false;
  DATA.cities.forEach((city, idx) => {
    if(!citySet.has(idx)) return;
    [DATA.avito, DATA.direct].forEach(src => {
      const v = src[city] && src[city][key];
      if(v && (v.spend>0 || v.leads>0 || v.bookings>0)){ spend+=v.spend; leads+=v.leads; bookings+=v.bookings; any=true; }
    });
  });
  return any ? {spend, leads, bookings} : null;
}
function trailingAvg(getter, year, month, n){
  const vals = [];
  let y=year, m=month;
  for(let i=0;i<n;i++){
    ({year:y, month:m} = shiftYM(y,m,-1));
    const v = getter(y,m);
    if(v !== null && v !== undefined && isFinite(v)) vals.push(v);
  }
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

// ---------- rendering ----------
function deltaBadge(label, current, prior, goodDirection){
  if(prior===null || prior===undefined || !isFinite(prior) || prior===0 || current===null || !isFinite(current)){
    return `<span class="delta-badge muted">${label} —</span>`;
  }
  const pct = (current-prior)/Math.abs(prior)*100;
  const isGood = goodDirection==='up' ? pct>=0 : pct<=0;
  const cls = Math.abs(pct) < 0.5 ? 'flat' : (isGood ? 'good' : 'bad');
  const arrow = pct >= 0 ? '▲' : '▼';
  return `<span class="delta-badge ${cls}">${label} ${arrow}${Math.abs(pct).toFixed(0)}%</span>`;
}

function metricRowHTML(opts){
  const hasDetail = !!opts.detailHTML;
  const expanded = hasDetail && state.expanded.has(opts.key);
  let paceHTML = '';
  if(opts.pace && opts.plan){
    const pct = Math.min(100, opts.fact/opts.plan*100);
    const pacePct = Math.min(100, elapsedFraction(state.year, state.month)*100);
    paceHTML = `<div class="mini-meter"><div class="mini-meter-fill" style="width:${pct}%;"></div><div class="mini-meter-pace" style="left:${pacePct}%;"></div></div>`;
  }
  return `
    <div class="metric-row">
      <div class="metric-head ${hasDetail?'clickable':''}" ${hasDetail?`onclick="toggleMetric('${opts.key}')"`:''}>
        <div class="metric-name">${opts.title}${hasDetail?`<span class="chevron">${expanded?'▾':'▸'}</span>`:''}</div>
        <div class="metric-figures">
          <div class="mf"><span class="mf-label">Факт</span><span class="mf-value">${fmtByUnit(opts.fact,opts.unit)}</span></div>
          <div class="mf"><span class="mf-label">План</span><span class="mf-value muted">${opts.plan!==null&&opts.plan!==undefined?fmtByUnit(opts.plan,opts.unit):'—'}</span></div>
          ${paceHTML}
          <div class="deltas">
            ${deltaBadge('мес', opts.momCurrent, opts.momPrior, opts.goodDirection)}
            ${deltaBadge('год', opts.yoyCurrent, opts.yoyPrior, opts.goodDirection)}
          </div>
        </div>
      </div>
      ${hasDetail ? `<div class="metric-detail" style="display:${expanded?'block':'none'}">${opts.detailHTML}</div>` : ''}
    </div>
  `;
}

function repeatSplitDetail(newObj, repeatObj, unit){
  const maxV = Math.max(newObj.revenue, repeatObj.revenue, 1);
  const row = (name, o) => `
    <tr>
      <td class="dt-name">${name}</td>
      <td class="dt-num">${fmtNum(o.count)} шт</td>
      <td class="dt-num">${fmtRubShort(o.revenue)}</td>
      <td><div class="detail-bar-track"><div class="detail-bar-fill" style="width:${o.revenue/maxV*100}%;"></div></div></td>
    </tr>`;
  return `<table class="detail-table">${row('Новые клиенты', newObj)}${row('Постоянные клиенты', repeatObj)}</table>`;
}

function channelSplitDetail(bySource, total){
  const rows = [...bySource.entries()]
    .map(([idx,count]) => ({name: DATA.sources[idx], count}))
    .sort((a,b) => b.count-a.count);
  const maxV = Math.max(...rows.map(r=>r.count), 1);
  return `<table class="detail-table">${rows.map(r => `
    <tr>
      <td class="dt-name">${r.name}</td>
      <td class="dt-num">${fmtNum(r.count)}</td>
      <td class="dt-num">${total>0?fmtPctVal(r.count/total*100):'—'}</td>
      <td><div class="detail-bar-track"><div class="detail-bar-fill" style="width:${r.count/maxV*100}%;"></div></div></td>
    </tr>`).join('')}</table>`;
}

function toggleMetric(key){
  if(state.expanded.has(key)) state.expanded.delete(key); else state.expanded.add(key);
  renderAll();
}

function renderMainMetrics(){
  const el = document.getElementById('mainMetrics');
  const cities = selectedCityIndices();
  if(!cities.size){ el.innerHTML = '<div class="empty-note">Выберите хотя бы один город</div>'; return; }
  const {year, month} = state;
  const prevM = shiftYM(year, month, -1);
  const rows = [];

  // 1. Выручка (протекающая, по факту пересечения дат аренды с периодом)
  {
    const fact = proratedRevenue(year, month, cities, null);
    const plan = manualRevenuePlan(year, month, cities) ?? trailingAvg((y,m)=>proratedRevenue(y,m,cities,null), year, month, 3);
    const mom = proratedRevenue(prevM.year, prevM.month, cities, null);
    const yoy = proratedRevenue(year-1, month, cities, null);
    rows.push(metricRowHTML({key:'revenue', title:'Выручка', unit:'currency', fact, plan, pace:true, goodDirection:'up',
      momCurrent:fact, momPrior:mom, yoyCurrent:fact, yoyPrior:yoy}));
  }
  // 2. Продления
  {
    const fact = prodlenieInPeriod(year, month, cities);
    const plan = trailingAvg((y,m)=>prodlenieInPeriod(y,m,cities), year, month, 3);
    const mom = prodlenieInPeriod(prevM.year, prevM.month, cities);
    rows.push(metricRowHTML({key:'prolong', title:'Продления', unit:'currency', fact, plan, pace:false, goodDirection:'up',
      momCurrent:fact, momPrior:mom, yoyCurrent:null, yoyPrior:null}));
  }
  // 3. Уже имеющиеся брони (созданы до начала периода, заезд -- в периоде)
  {
    const f = bookingsAlreadyBooked(year, month, cities, null);
    const planC = trailingAvg((y,m)=>bookingsAlreadyBooked(y,m,cities,null).revenue, year, month, 3);
    const momF = bookingsAlreadyBooked(prevM.year, prevM.month, cities, null);
    const yoyF = bookingsAlreadyBooked(year-1, month, cities, null);
    rows.push(metricRowHTML({key:'already', title:'Уже имеющиеся брони', unit:'currency', fact:f.revenue, plan:planC, pace:false, goodDirection:'up',
      momCurrent:f.revenue, momPrior:momF.revenue, yoyCurrent:f.revenue, yoyPrior:yoyF.revenue,
      detailHTML: `<div class="empty-note" style="text-align:left; padding:4px 0;">Броней: <b>${fmtNum(f.count)}</b> (сделаны до начала месяца, заезд -- в этом месяце)</div>`}));
  }
  // 4. Конверсия
  {
    const conv = (y,m) => { const l=leadsInPeriod(y,m,cities); const b=bookingsCreatedInPeriod(y,m,cities,null); return l.total>0? b.count/l.total*100 : null; };
    const fact = conv(year, month);
    const plan = trailingAvg(conv, year, month, 3);
    const mom = conv(prevM.year, prevM.month);
    const yoy = conv(year-1, month);
    rows.push(metricRowHTML({key:'conv', title:'Конверсия', unit:'percent', fact, plan, pace:!!plan, goodDirection:'up',
      momCurrent:fact, momPrior:mom, yoyCurrent:fact, yoyPrior:yoy}));
  }
  // 5. Кол-во и выручка текущего периода (по дате заезда), + новые/старые
  {
    const f = bookingsPickupInPeriod(year, month, cities, null);
    const planRev = trailingAvg((y,m)=>bookingsPickupInPeriod(y,m,cities,null).revenue, year, month, 3);
    const momF = bookingsPickupInPeriod(prevM.year, prevM.month, cities, null);
    const yoyF = bookingsPickupInPeriod(year-1, month, cities, null);
    const newO = bookingsPickupInPeriod(year, month, cities, 0);
    const repO = bookingsPickupInPeriod(year, month, cities, 1);
    rows.push(metricRowHTML({key:'period', title:'Брони периода (заезд)', unit:'currency', fact:f.revenue, plan:planRev, pace:true, goodDirection:'up',
      momCurrent:f.revenue, momPrior:momF.revenue, yoyCurrent:f.revenue, yoyPrior:yoyF.revenue,
      detailHTML: `<div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Всего броней: ${fmtNum(f.count)}</div>` + repeatSplitDetail(newO, repO)}));
  }

  el.innerHTML = rows.join('');

  // 6. Отмены + будущие брони (два подряд, с раскрытием новые/старые)
  const el6 = document.getElementById('cancelFutureMetrics');
  {
    const rows6 = [];
    const c = cancellationsInPeriod(year, month, cities, null);
    const planC = trailingAvg((y,m)=>cancellationsInPeriod(y,m,cities,null).revenue, year, month, 3);
    const momC = cancellationsInPeriod(prevM.year, prevM.month, cities, null);
    const yoyC = cancellationsInPeriod(year-1, month, cities, null);
    const cNew = cancellationsInPeriod(year, month, cities, 0);
    const cRep = cancellationsInPeriod(year, month, cities, 1);
    rows6.push(metricRowHTML({key:'cancel', title:'Отмены', unit:'currency', fact:c.revenue, plan:planC, pace:true, goodDirection:'down',
      momCurrent:c.revenue, momPrior:momC.revenue, yoyCurrent:c.revenue, yoyPrior:yoyC.revenue,
      detailHTML: `<div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Отменено броней: ${fmtNum(c.count)}</div>` + repeatSplitDetail(cNew, cRep)}));

    const f = bookingsFuture(year, month, cities, null);
    const planF = trailingAvg((y,m)=>bookingsFuture(y,m,cities,null).revenue, year, month, 3);
    const momF = bookingsFuture(prevM.year, prevM.month, cities, null);
    const yoyF = bookingsFuture(year-1, month, cities, null);
    const fNew = bookingsFuture(year, month, cities, 0);
    const fRep = bookingsFuture(year, month, cities, 1);
    rows6.push(metricRowHTML({key:'future', title:'Будущие брони', unit:'currency', fact:f.revenue, plan:planF, pace:true, goodDirection:'up',
      momCurrent:f.revenue, momPrior:momF.revenue, yoyCurrent:f.revenue, yoyPrior:yoyF.revenue,
      detailHTML: `<div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Продано вперёд броней: ${fmtNum(f.count)} (заезд -- после конца месяца)</div>` + repeatSplitDetail(fNew, fRep)}));
    el6.innerHTML = rows6.join('');
  }

  // 7. % отмен и % будущих броней
  const el7 = document.getElementById('rateMetrics');
  {
    const rows7 = [];
    const rate = (y,m,rf) => {
      const c = cancellationsInPeriod(y,m,cities,rf).count;
      const b = bookingsPickupInPeriod(y,m,cities,rf).count;
      return (c+b) > 0 ? c/(c+b)*100 : null;
    };
    const fact = rate(year,month,null);
    const plan = trailingAvg((y,m)=>rate(y,m,null), year, month, 3);
    const mom = rate(prevM.year, prevM.month, null);
    const yoy = rate(year-1, month, null);
    rows7.push(metricRowHTML({key:'cancelRate', title:'% отмен', unit:'percent', fact, plan, pace:!!plan, goodDirection:'down',
      momCurrent:fact, momPrior:mom, yoyCurrent:fact, yoyPrior:yoy,
      detailHTML: `<div class="empty-note" style="text-align:left; padding:4px 0;">Новые: ${fmtPctVal(rate(year,month,0))} · Постоянные: ${fmtPctVal(rate(year,month,1))}</div>`}));

    const futRate = (y,m,rf) => {
      const fut = bookingsFuture(y,m,cities,rf).count;
      const created = bookingsCreatedInPeriod(y,m,cities,rf).count;
      return created > 0 ? fut/created*100 : null;
    };
    const factF = futRate(year,month,null);
    const planF = trailingAvg((y,m)=>futRate(y,m,null), year, month, 3);
    const momF = futRate(prevM.year, prevM.month, null);
    const yoyF = futRate(year-1, month, null);
    rows7.push(metricRowHTML({key:'futureRate', title:'% будущих броней', unit:'percent', fact:factF, plan:planF, pace:!!planF, goodDirection:'up',
      momCurrent:factF, momPrior:momF, yoyCurrent:factF, yoyPrior:yoyF,
      detailHTML: `<div class="empty-note" style="text-align:left; padding:4px 0;">Новые: ${fmtPctVal(futRate(year,month,0))} · Постоянные: ${fmtPctVal(futRate(year,month,1))}</div>`}));
    el7.innerHTML = rows7.join('');
  }

  // 8. Лиды
  const el8 = document.getElementById('leadsMetric');
  {
    const l = leadsInPeriod(year, month, cities);
    const plan = trailingAvg((y,m)=>leadsInPeriod(y,m,cities).total, year, month, 3);
    const mom = leadsInPeriod(prevM.year, prevM.month, cities).total;
    const yoy = leadsInPeriod(year-1, month, cities).total;
    el8.innerHTML = metricRowHTML({key:'leads', title:'Лиды', unit:'number', fact:l.total, plan, pace:true, goodDirection:'up',
      momCurrent:l.total, momPrior:mom, yoyCurrent:l.total, yoyPrior:yoy,
      detailHTML: channelSplitDetail(l.bySource, l.total)});
  }
}

function renderExtraMetrics(){
  const el = document.getElementById('extraMetrics');
  const cities = selectedCityIndices();
  if(!cities.size){ el.innerHTML = '<div class="empty-note">Выберите хотя бы один город</div>'; return; }
  const {year, month} = state;
  const prevM = shiftYM(year, month, -1);
  const rows = [];

  // Доп 1: средний чек (по дате заезда, как и "Брони периода")
  {
    const avgCheck = (y,m,rf) => { const o=bookingsPickupInPeriod(y,m,cities,rf); return o.count>0? o.revenue/o.count : null; };
    const fact = avgCheck(year,month,null);
    const plan = trailingAvg((y,m)=>avgCheck(y,m,null), year, month, 3);
    const mom = avgCheck(prevM.year, prevM.month, null);
    const yoy = avgCheck(year-1, month, null);
    rows.push(metricRowHTML({key:'avgcheck', title:'Средний чек', unit:'currency', fact, plan, pace:false, goodDirection:'up',
      momCurrent:fact, momPrior:mom, yoyCurrent:fact, yoyPrior:yoy,
      detailHTML: `<div class="empty-note" style="text-align:left; padding:4px 0;">Новые: ${fmtByUnit(avgCheck(year,month,0),'currency')} · Постоянные: ${fmtByUnit(avgCheck(year,month,1),'currency')}</div>`}));
  }
  // Доп 2/3: стоимость лида / стоимость брони (Авито + Директ)
  {
    const cpl = (y,m) => { const s=paidChannelStats(y,m,cities); return s && s.leads>0 ? s.spend/s.leads : null; };
    const cpb = (y,m) => { const s=paidChannelStats(y,m,cities); return s && s.bookings>0 ? s.spend/s.bookings : null; };
    const factCPL = cpl(year,month), planCPL = trailingAvg(cpl, year, month, 3);
    const momCPL = cpl(prevM.year, prevM.month), yoyCPL = cpl(year-1, month);
    rows.push(metricRowHTML({key:'cpl', title:'Стоимость лида', unit:'currency', fact:factCPL, plan:planCPL, pace:false, goodDirection:'down',
      momCurrent:factCPL, momPrior:momCPL, yoyCurrent:factCPL, yoyPrior:yoyCPL}));

    const factCPB = cpb(year,month), planCPB = trailingAvg(cpb, year, month, 3);
    const momCPB = cpb(prevM.year, prevM.month), yoyCPB = cpb(year-1, month);
    rows.push(metricRowHTML({key:'cpb', title:'Стоимость брони', unit:'currency', fact:factCPB, plan:planCPB, pace:false, goodDirection:'down',
      momCurrent:factCPB, momPrior:momCPB, yoyCurrent:factCPB, yoyPrior:yoyCPB}));
  }

  el.innerHTML = rows.join('');
}
