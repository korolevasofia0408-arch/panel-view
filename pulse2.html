<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CARS&amp;GO · Пульс 2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --card-border:    rgba(11,11,11,0.08);
    --card-shadow:    0 1px 2px rgba(11,11,11,0.04), 0 6px 16px -8px rgba(11,11,11,0.10);
    --accent:         #2a78d6;
    --accent-light:   #86b6ef;
    --accent-wash:    rgba(42,120,214,0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --good-wash: rgba(12,163,12,0.12); --warning-wash: rgba(250,178,25,0.14); --critical-wash: rgba(208,59,59,0.12);
    --chip-bg: #f2f1ec; --chip-bg-hover: #ebe9e2; --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --gridline: #2c2c2a; --baseline: #383835; --card-border: rgba(255,255,255,0.08);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
      --accent: #3987e5; --accent-light: #184f95; --accent-wash: rgba(57,135,229,0.14);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --good: #0ca30c; --warning: #fab219; --critical: #e66767;
      --good-wash: rgba(12,163,12,0.18); --warning-wash: rgba(250,178,25,0.16); --critical-wash: rgba(230,103,103,0.16);
      --chip-bg: #232322; --chip-bg-hover: #2b2b29; --input-bg: #141413;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --gridline: #2c2c2a; --baseline: #383835; --card-border: rgba(255,255,255,0.08);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --good: #0ca30c; --warning: #fab219; --critical: #e66767;
    --good-wash: rgba(12,163,12,0.18); --warning-wash: rgba(250,178,25,0.16); --critical-wash: rgba(230,103,103,0.16);
    --chip-bg: #232322; --chip-bg-hover: #2b2b29; --input-bg: #141413;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--page-plane); color:var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 64px; }
  header.top{ display:flex; flex-direction:column; gap:4px; margin-bottom:20px; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); }
  h1{ font-size:28px; font-weight:800; margin:2px 0 0; letter-spacing:-0.02em; }
  .subtitle{ font-size:13.5px; color:var(--text-secondary); margin-top:2px; }
  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface-1); border-radius:12px; padding:12px 14px; margin-bottom:20px; box-shadow:var(--card-shadow); }
  .sep{ width:1px; align-self:stretch; background:var(--gridline); }
  .chip{ font: inherit; font-size:12px; color:var(--text-secondary); background:var(--chip-bg); border:1px solid transparent; border-radius:20px; padding:5px 12px; cursor:pointer; }
  .chip:hover{ background:var(--chip-bg-hover); }
  .chip.active{ background:var(--accent-wash); color:var(--accent); font-weight:600; }
  .chips-row{ display:flex; flex-wrap:wrap; gap:6px; }

  .card{ background:var(--surface-1); border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--card-shadow); }
  .card h2{ font-size:13.5px; font-weight:700; margin:0 0 3px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .hint{ font-size:11.5px; color:var(--text-muted); margin-bottom:8px; }
  .expand-btn{ font:inherit; font-size:11.5px; color:var(--accent); background:none; border:none; cursor:pointer; font-weight:600; white-space:nowrap; }

  .stat-row{ display:flex; gap:24px; flex-wrap:wrap; align-items:baseline; }
  .stat-tile .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:4px; }
  .stat-tile .stat-value{ font-size:23px; font-weight:800; letter-spacing:-0.015em; }
  .stat-tile .stat-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }

  /* Compact one-line metric row: label/value pairs + a status pill, used for the simpler cards
     (Продления, Уже имеющиеся, Конверсия, стоимости) instead of the bigger 3-tile stat-row. */
  .mini-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:12.5px; margin-bottom:6px; }
  .mini-row:last-child{ margin-bottom:0; }
  .mini-row b{ font-variant-numeric:tabular-nums; color:var(--text-primary); }
  .mini-label{ color:var(--text-muted); font-size:11px; }
  .mini-sub{ color:var(--text-secondary); font-size:11px; }
  .mini-metric-name{ font-weight:700; min-width:96px; color:var(--text-secondary); }

  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .status-pill.sm{ background:none !important; padding:0; margin-left:auto; font-size:12px; }
  .status-pill.sm.good{ color:var(--good); }
  .status-pill.sm.warning{ color:#8a5a00; }
  :root[data-theme="dark"] .status-pill.sm.warning{ color:var(--warning); }
  @media (prefers-color-scheme:dark){ .status-pill.sm.warning{ color:var(--warning); } }
  .status-pill.sm.critical{ color:var(--critical); }
  .status-pill.good{ background:var(--good-wash); color:var(--good); }
  .status-pill.warning{ background:var(--warning-wash); color:#8a5a00; }
  :root[data-theme="dark"] .status-pill.warning{ color:var(--warning); }
  @media (prefers-color-scheme:dark){ .status-pill.warning{ color:var(--warning); } }
  .status-pill.critical{ background:var(--critical-wash); color:var(--critical); }

  .mom-note{ font-size:11.5px; color:var(--text-muted); margin-top:8px; }
  .mom-note b{ color:var(--text-secondary); }

  .seg-detail{ margin-top:14px; padding-top:14px; border-top:1px solid var(--gridline); display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media (max-width:640px){ .seg-detail{ grid-template-columns:1fr; } }
  .seg-block .seg-title{ font-size:11.5px; font-weight:700; color:var(--text-secondary); margin-bottom:6px; }
  .seg-block .seg-line{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px; }
  .seg-block .seg-line b{ font-variant-numeric:tabular-nums; }

  .chan-list{ display:flex; flex-direction:column; gap:8px; }
  .chan-row{ display:flex; align-items:center; gap:10px; }
  .chan-row .chan-name{ width:170px; flex:none; font-size:12.5px; color:var(--text-secondary); }
  .chan-row .chan-bar-track{ flex:1; height:8px; border-radius:4px; background:var(--gridline); overflow:hidden; }
  .chan-row .chan-bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .chan-row .chan-val{ width:110px; flex:none; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; color:var(--text-secondary); }
  .chan-row .chan-val b{ color:var(--text-primary); }

  .empty-note{ font-size:12.5px; color:var(--text-muted); padding:12px 0; text-align:center; }
  footer.caveats{ font-size:12px; color:var(--text-muted); border-top:1px solid var(--gridline); padding-top:14px; line-height:1.65; margin-top:8px; }
  footer.caveats b{ color:var(--text-secondary); }

  /* ---- meter: plan/fact progress with a pace tick ---- */
  .meter-track{ position:relative; height:14px; border-radius:7px; background:var(--gridline); margin:12px 0 5px; }
  .meter-track.sm{ height:8px; margin:8px 0 0; border-radius:4px; }
  .meter-fill{ position:absolute; left:0; top:0; height:100%; border-radius:7px 3px 3px 7px; transition:width .2s; }
  .meter-fill.good{ background:var(--good); }
  .meter-fill.warning{ background:var(--warning); }
  .meter-fill.critical{ background:var(--critical); }
  .meter-pace{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text-primary); }
  .meter-legend{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); margin-bottom:4px; }

  /* ---- deviation bar: for metrics where "план" is a baseline/midpoint and "факт" drifts above
     or below it (e.g. "Уже имеющиеся брони"), not a 0-to-target pace metric. Centre = план,
     fill grows left (critical) or right (good) from centre by the deviation %. ---- */
  .dev-track{ position:relative; height:14px; border-radius:7px; background:var(--gridline); margin:12px 0 5px; overflow:hidden; }
  .dev-track.sm{ height:8px; margin:8px 0 0; border-radius:4px; }
  .dev-center{ position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--text-primary); z-index:1; }
  .dev-fill{ position:absolute; top:0; height:100%; transition:width .2s, left .2s; }
  .dev-fill.good{ background:var(--good); }
  .dev-fill.critical{ background:var(--critical); }
  .dev-legend{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); margin-bottom:4px; }
  .dev-sum{ font-size:12px; margin-top:2px; }
  .dev-sum b{ font-variant-numeric:tabular-nums; }
  .dev-sum b.up{ color:var(--good); }
  .dev-sum b.down{ color:var(--critical); }

  /* ---- month-over-month mini bar chart ---- */
  .mcompare{ display:flex; gap:16px; align-items:flex-end; height:70px; margin-top:6px; padding-top:18px; }
  .mcompare .mc-col{ flex:1; max-width:70px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .mcompare .mc-val{ font-size:11px; font-weight:700; margin-bottom:4px; color:var(--text-primary); white-space:nowrap; }
  .mcompare .mc-bar{ width:60%; border-radius:3px 3px 0 0; background:var(--accent-light); }
  .mcompare .mc-bar.current{ background:var(--accent); }
  .mcompare .mc-lbl{ font-size:10.5px; color:var(--text-muted); margin-top:5px; }

  /* ---- stacked new/repeat bar ---- */
  .stack-bar{ display:flex; height:20px; border-radius:5px; overflow:hidden; margin:10px 0 8px; gap:2px; }
  .stack-bar .seg{ height:100%; }
  .stack-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--text-secondary); margin-bottom:2px; }
  .stack-legend .sw{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .stack-legend b{ color:var(--text-primary); font-variant-numeric:tabular-nums; }

  /* ---- rate gauge (percent with a plan tick) ---- */
  .gauge-track{ position:relative; height:10px; border-radius:5px; background:var(--gridline); margin:8px 0 2px; }
  .gauge-track.sm{ height:7px; margin:6px 0 0; }
  .gauge-fill{ position:absolute; left:0; top:0; height:100%; border-radius:5px; background:var(--accent); }
  .gauge-plan-tick{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text-primary); }

  /* ---- small twin bars (plan vs fact) ---- */

  /* ---- sticky toolbar ---- */
  .toolbar{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--page-plane) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    margin-left:-20px; margin-right:-20px; padding-left:20px; padding-right:20px;
    border-radius:0; border-left:none; border-right:none; border-top:none;
    transition:box-shadow .15s, border-color .15s;
  }
  .toolbar.stuck{ box-shadow:0 10px 24px -12px rgba(0,0,0,0.35); }

  /* ---- KPI strip (headline cards with sparklines) ---- */
  .kpi-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:900px){ .kpi-strip{ grid-template-columns:repeat(2,1fr); } }
  .kpi-card{ background:var(--surface-1); border-radius:14px; padding:16px 18px; box-shadow:var(--card-shadow); }
  .kpi-card .kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:6px; }
  .kpi-card .kpi-value-row{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .kpi-card .kpi-value{ font-size:27px; font-weight:800; letter-spacing:-0.02em; }
  .kpi-card .kpi-delta{ font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:999px; }
  .kpi-card .kpi-delta.up{ background:var(--good-wash); color:var(--good); }
  .kpi-card .kpi-delta.down{ background:var(--critical-wash); color:var(--critical); }
  .kpi-card .kpi-sub{ font-size:11px; color:var(--text-secondary); margin-bottom:8px; }
  .kpi-card .kpi-spark{ display:block; width:100%; height:32px; }

  /* ---- weekly revenue: hero area chart (gradient fill, line, endpoint dots) ---- */
  .week-area-chart{ display:block; width:100%; height:210px; overflow:visible; }
  .week-chart-legend{ display:flex; gap:18px; margin-top:6px; font-size:11.5px; color:var(--text-secondary); }
  .week-chart-legend .lk{ display:inline-block; width:16px; height:0; border-top:2.5px solid var(--accent); margin-right:6px; vertical-align:middle; }
  .week-chart-legend .lk.dashed{ border-top:2px dashed var(--text-muted); }
  .week-chart-legend .lk.dotted{ border-top:2px dotted var(--series-2); }
  .yoy-note{ font-size:11.5px; color:var(--text-secondary); margin-top:6px; }
  .yoy-note b{ font-variant-numeric:tabular-nums; }
  .yoy-note b.up{ color:var(--good); }
  .yoy-note b.down{ color:var(--critical); }

  /* ---- two-column detail grid ---- */
  /* CSS multi-column (not display:grid) so cards stack tight within each column regardless of
     their neighbour's height -- a strict grid with align-items:start left uneven gaps under
     short cards whenever the card next to them was taller, since the next grid row only starts
     once both cells in the row have ended. */
  .detail-grid{ columns:2; column-gap:14px; }
  @media (max-width:820px){ .detail-grid{ columns:1; } }
  .detail-grid .card{ break-inside:avoid; }

  /* ---- per-city collapsible cards ---- */
  .city-cards{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .city-card{ background:var(--surface-1); border-radius:14px; overflow:hidden; box-shadow:var(--card-shadow); }
  .city-head{
    display:block; width:100%; text-align:left; font:inherit; color:inherit;
    background:none; border:none; cursor:pointer; padding:16px 18px;
  }
  .city-head:hover{ background:var(--chip-bg-hover); }
  .city-head-top{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .city-head-top .chevron{ font-size:11px; color:var(--text-muted); width:10px; flex:none; align-self:center; transition:transform .15s; }
  .city-head-top .city-name{ font-size:15.5px; font-weight:700; flex:1; align-self:center; }
  .city-head-top .city-pace{ font-size:24px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .city-head-top .city-pace.good{ color:var(--good); }
  .city-head-top .city-pace.warning{ color:#8a5a00; }
  :root[data-theme="dark"] .city-head-top .city-pace.warning{ color:var(--warning); }
  @media (prefers-color-scheme:dark){ .city-head-top .city-pace.warning{ color:var(--warning); } }
  .city-head-top .city-pace.critical{ color:var(--critical); }
  .city-head-meter{ margin-bottom:8px; }
  .city-head-mini{ display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary); }
  .city-head-mini b{ color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .city-body{ padding:0 18px 18px; }
  .city-body .card{ background:var(--page-plane); margin-bottom:14px; box-shadow:none; }
  .city-body .detail-grid{ margin-bottom:0; }
  .city-insight{ background:var(--chip-bg-hover); border-left:3px solid var(--accent); border-radius:10px; padding:12px 14px; margin-top:14px; font-size:12.8px; line-height:1.6; color:var(--text-primary); }
  .city-insight b{ font-variant-numeric:tabular-nums; }
  .city-insight b.up{ color:var(--good); }
  .city-insight b.down{ color:var(--critical); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">CARS&amp;GO · Пульс 2</div>
    <h1>Показатели из РНП</h1>
    <div class="subtitle" id="subtitle">Загрузка…</div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="chips-row" id="monthChips"></div>
  </div>

  <div class="kpi-strip" id="kpiStrip"></div>

  <div class="hint" style="margin-bottom:8px;">Города — по убыванию отставания от темпа выручки. Клик по городу разворачивает полную детализацию по нему.</div>
  <div class="city-cards" id="cityCards"></div>

  <footer class="caveats" id="caveats"></footer>
</div>

<script>
const fmtRub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fmtRubShort = n => { const a=Math.abs(n); if(a>=1e6) return (n/1e6).toFixed(1).replace('.0','')+' млн ₽'; if(a>=1e3) return Math.round(n/1e3)+' тыс ₽'; return Math.round(n)+' ₽'; };
const fmtNum = n => Math.round(n).toLocaleString('ru-RU');
const fmtPct = (n,d) => isFinite(n) ? n.toFixed(d===undefined?0:d)+'%' : '—';

let DATA = null;
const MONTHS = ["Май 2026","Июнь 2026","Июль 2026","Август 2026"];
const CITIES = ["Москва","Екатеринбург","Новосибирск","Тюмень","Красноярск","Иркутск"];
const state = { month: MONTHS[MONTHS.length-1] };

// Cities are no longer picked via chips -- every metric function below still asks
// selectedCities() for "which cities to sum", but that now means "just the one city currently
// being rendered" while a city card's section is being built (renderCityCards sets this before
// each city's batch of render calls and clears it after), or "the whole company" for the
// KPI strip and anything else rendered with no city context set.
let cityRenderCtx = null;
function selectedCities(){ return cityRenderCtx ? [cityRenderCtx] : CITIES; }

function elapsedFraction(monthKey){
  const cities = selectedCities();
  if(!cities.length) return 1;
  const meta = DATA[monthKey][cities[0]].meta;
  const start = new Date(meta['Начало месяца']), end = new Date(meta['Конец месяца']);
  const daysInMonth = Math.round((end-start)/86400000)+1;
  const elapsed = meta['Прошло дней'];
  return Math.max(elapsed/daysInMonth, 1/daysInMonth);
}

function getPath(obj, path){ let n=obj; for(const p of path){ if(n==null) return undefined; n = n[p]; } return n; }

function sumMetric(monthKey, path){
  let plan=0, fact=0;
  selectedCities().forEach(c => { const m = getPath(DATA[monthKey][c], path); if(m){ plan += m.plan||0; fact += m.fact||0; } });
  return {plan, fact};
}

function weightedRate(monthKey, path, weightPath){
  let planNum=0, planDen=0, factNum=0, factDen=0;
  selectedCities().forEach(c => {
    const rate = getPath(DATA[monthKey][c], path);
    const w = getPath(DATA[monthKey][c], weightPath);
    if(!rate || !w) return;
    if(isFinite(rate.plan) && isFinite(w.plan)){ planNum += rate.plan*w.plan; planDen += w.plan; }
    if(isFinite(rate.fact) && isFinite(w.fact)){ factNum += rate.fact*w.fact; factDen += w.fact; }
  });
  return { plan: planDen>0 ? planNum/planDen : NaN, fact: factDen>0 ? factNum/factDen : NaN };
}

function statusFor(ratio){ if(ratio>=1) return 'good'; if(ratio>=0.85) return 'warning'; return 'critical'; }
function statusLabel(s){ return s==='good' ? 'В норме' : (s==='warning' ? 'Чуть отстаём' : 'Отстаём'); }

// Pace: for additive month-totals, adjust the plan by how much of the month has elapsed.
function meterBarHtml(fact, plan, frac, status, compact){
  const pct = plan>0 ? Math.min(100, fact/plan*100) : 0;
  const pacePct = Math.min(100, frac*100);
  const track = `
    <div class="meter-track ${compact?'sm':''}">
      <div class="meter-fill ${status||'good'}" style="width:${pct}%;"></div>
      <div class="meter-pace" style="left:${pacePct}%;" title="Темп: доля прошедших дней месяца"></div>
    </div>`;
  if(compact) return track;
  return track + `<div class="meter-legend"><span>план на сегодня (по темпу)</span><span>план на весь месяц</span></div>`;
}


function paceCard(el, title, monthMetric, unit, fmt){
  const {plan, fact} = monthMetric;
  const frac = elapsedFraction(state.month);
  const paceTarget = plan*frac;
  const ratio = paceTarget>0 ? fact/paceTarget : (fact>0?1:0);
  const status = statusFor(ratio);
  const thisPct = plan>0 ? (fact/plan*100) : NaN;

  const yoy = monthMetric.__path ? yoyFor(state.month, monthMetric.__path[1]) : null;
  const yoyHtml = yoy && yoy.deltaPct!=null
    ? `<div class="yoy-note">к ${state.month.replace('2026','2025')}: <b class="${yoy.deltaPct>=0?'up':'down'}">${yoy.deltaPct>=0?'+':''}${(yoy.deltaPct*100).toFixed(1)}%</b></div>` : '';

  el.innerHTML = `
    <div class="mini-row">
      <span><span class="mini-label">План</span> <b>${fmt(plan)}</b></span>
      <span><span class="mini-label">Факт</span> <b>${fmt(fact)}</b> <span class="mini-sub">${fmtPct(thisPct,0)}</span></span>
      <span class="status-pill sm ${status}">${fmtPct(ratio*100,0)}</span>
    </div>
    ${meterBarHtml(fact, plan, frac, status, true)}
    ${yoyHtml}
  `;
}

// For metrics where "план" is a fixed baseline and "факт" drifts above or below it during the
// month (e.g. "Уже имеющиеся брони" -- revenue from bookings made before the period even started,
// so it isn't a 0-to-target pace metric, it moves as those pre-existing bookings get cancelled or
// added to). Shows the actual deviation sum, not a percent-of-plan progress bar.
function deviationCard(el, monthMetric, fmt){
  const {plan, fact} = monthMetric;
  const delta = fact - plan;
  const deltaPct = plan ? delta/plan*100 : null;
  const status = delta>=0 ? 'good' : 'critical';
  const pctText = deltaPct!=null ? (delta>=0?'+':'')+deltaPct.toFixed(1)+'%' : '—';

  // Cap the visible bar at +-50% so one outlier city doesn't flatten the scale for everyone else
  // -- the exact rouble sum is always in the text regardless of how the bar is capped.
  const capPct = deltaPct==null ? 0 : Math.max(-50, Math.min(50, deltaPct));
  const fillStyle = capPct>=0
    ? `left:50%; width:${capPct/2}%;`
    : `left:${50+capPct/2}%; width:${-capPct/2}%;`;

  const yoy = monthMetric.__path ? yoyFor(state.month, monthMetric.__path[1]) : null;
  const yoyHtml = yoy && yoy.deltaPct!=null
    ? `<div class="yoy-note">к ${state.month.replace('2026','2025')}: <b class="${yoy.deltaPct>=0?'up':'down'}">${yoy.deltaPct>=0?'+':''}${(yoy.deltaPct*100).toFixed(1)}%</b></div>` : '';

  el.innerHTML = `
    <div class="mini-row">
      <span><span class="mini-label">План (базовое значение)</span> <b>${fmt(plan)}</b></span>
      <span><span class="mini-label">Факт</span> <b>${fmt(fact)}</b></span>
      <span class="status-pill sm ${status}">${pctText}</span>
    </div>
    <div class="dev-track sm">
      <div class="dev-center"></div>
      <div class="dev-fill ${status}" style="${fillStyle}"></div>
    </div>
    <div class="dev-sum">Отклонение от плана: <b class="${status==='good'?'up':'down'}">${delta>=0?'+':'−'}${fmt(Math.abs(delta))}</b></div>
    ${yoyHtml}
  `;
}

// Sums a per-city weekly array (5 slots, null past the elapsed weeks) across selected cities.
function weeklyAggregate(monthKey, metric){
  const arrs = selectedCities().map(c => (DATA[monthKey][c].weekly && DATA[monthKey][c].weekly[metric]) || [null,null,null,null,null]);
  return [0,1,2,3,4].map(i => {
    let sum = null;
    arrs.forEach(a => { if(a[i] != null) sum = (sum||0) + a[i]; });
    return sum;
  });
}
function weekRangeLabel(monthKey, idx){
  const shortDate = d => new Date(d).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
  for(const c of selectedCities()){
    const wr = DATA[monthKey][c].weekRanges && DATA[monthKey][c].weekRanges[idx];
    if(wr && wr[0]){
      if(wr[1] && wr[1] !== wr[0]) return `${new Date(wr[0]).getDate()}–${shortDate(wr[1])}`;
      return shortDate(wr[0]);
    }
  }
  return `Н${idx+1}`;
}

// The card the user pointed at directly: flat "July vs August" bars made it impossible to see
// week-to-week movement without paging between month chips. Both months' weeks now render
// side by side, always, with a visible divider and distinct hues -- no paging needed to compare.
// Hero visual for the card: a gradient area chart (line + fill + endpoint dots), both months'
// weeks in one continuous series so a dip or a rise reads as a shape, not a row of same-height
// bars. `uid` keeps the SVG gradient id unique per city (multiple charts share one DOM).
function prevMonthOf(monthKey){
  const idx = MONTHS.indexOf(monthKey);
  return idx > 0 ? MONTHS[idx-1] : null;
}

// Overlays the current month's weeks against the previous month's weeks AT THE SAME WEEK
// POSITION (week 1 vs week 1, week 2 vs week 2, ...) instead of stringing both months together
// on one timeline -- that's what actually lets you see "was this week weaker than the same week
// last month", which a concatenated chart doesn't show directly. Current month: solid line +
// gradient fill, only as far as weeks have actually happened. Previous month: dashed reference
// line, full shape, no fill -- it's context, not the headline.
// yoy2025 is a single flat weekly-average figure (RNP gives no per-week shape for 2025) -- drawn
// as a dotted horizontal reference line, deliberately styled differently from both other series
// so it can't be mistaken for a real week-by-week trend.
function weeklyCompareChartSvg(curVals, prevVals, curLabel, prevLabel, yoy2025, uid, fmt){
  const n = 5;
  const known = [...curVals, ...prevVals].filter(v=>v!=null);
  if(known.length < 2) return '<div class="empty-note">Недостаточно недель для графика</div>';
  const W = 900, H = 210, padL = 16, padR = 16, padT = 34, padB = 30;
  const maxV = Math.max(...known, yoy2025||0, 1);
  const stepX = (W-padL-padR)/(n-1);
  const xAt = i => padL + i*stepX;
  const yAt = v => padT + (1 - v/maxV) * (H-padT-padB);
  const baseline = H-padB;

  const ptsOf = vals => { const out=[]; vals.forEach((v,i)=>{ if(v!=null) out.push([xAt(i), yAt(v), v]); }); return out; };
  const curPts = ptsOf(curVals), prevPts = ptsOf(prevVals);
  const lineD = pts => pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pts => pts.length ? lineD(pts) + ` L${pts[pts.length-1][0].toFixed(1)},${baseline} L${pts[0][0].toFixed(1)},${baseline} Z` : '';

  const weekAxisLabels = Array.from({length:n}, (_,i) => `<text x="${xAt(i).toFixed(1)}" y="${baseline+18}" font-size="10" text-anchor="middle" fill="var(--text-muted)">Нед. ${i+1}</text>`).join('');

  const prevLine = prevPts.length>1 ? `<path d="${lineD(prevPts)}" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="5,4" stroke-linejoin="round" stroke-linecap="round"></path>` : '';
  const prevDots = prevPts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--surface-1)" stroke="var(--text-muted)" stroke-width="2"></circle>`).join('');
  const prevLabels = prevPts.map(p => `<text x="${p[0].toFixed(1)}" y="${(p[1]+16).toFixed(1)}" font-size="9.5" text-anchor="middle" fill="var(--text-muted)">${fmt(p[2])}</text>`).join('');

  const curArea = curPts.length ? `<path d="${areaD(curPts)}" fill="url(#revGrad${uid})" stroke="none"></path>` : '';
  const curLine = curPts.length>1 ? `<path d="${lineD(curPts)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>` : '';
  const curDots = curPts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--surface-1)" stroke="var(--accent)" stroke-width="2.5"></circle>`).join('');
  const curLabels = curPts.map(p => `<text x="${p[0].toFixed(1)}" y="${(p[1]-11).toFixed(1)}" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--text-primary)">${fmt(p[2])}</text>`).join('');

  const yoyY = yoy2025!=null ? yAt(yoy2025) : null;
  const yoyLine = yoyY!=null ? `<line x1="${padL}" y1="${yoyY.toFixed(1)}" x2="${W-padR}" y2="${yoyY.toFixed(1)}" stroke="var(--series-2)" stroke-width="1.75" stroke-dasharray="1,4" stroke-linecap="round"></line>` : '';
  const yoyLabel = yoyY!=null ? `<text x="${W-padR}" y="${(yoyY-6).toFixed(1)}" font-size="10" font-weight="700" text-anchor="end" fill="var(--series-2)">2025: ${fmt(yoy2025)}/нед</text>` : '';

  const legend = (prevPts.length || yoyY!=null) ? `
    <div class="week-chart-legend">
      <span><span class="lk solid"></span>${curLabel}</span>
      ${prevPts.length ? `<span><span class="lk dashed"></span>${prevLabel} (для сравнения)</span>` : ''}
      ${yoyY!=null ? `<span><span class="lk dotted"></span>2025 (в среднем/нед, без формы по неделям)</span>` : ''}
    </div>` : '';

  return `
    <svg class="week-area-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="revGrad${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.30"></stop>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <line x1="${padL}" y1="${baseline}" x2="${W-padR}" y2="${baseline}" stroke="var(--baseline)" stroke-width="1"></line>
      ${curArea}
      ${yoyLine}
      ${prevLine}
      ${curLine}
      ${prevDots}
      ${curDots}
      ${prevLabels}
      ${curLabels}
      ${weekAxisLabels}
      ${yoyLabel}
    </svg>
    ${legend}
  `;
}

// Only meaningful for exactly one city (per-city cards always render with cityRenderCtx set) --
// returns null rather than fabricating a combined percentage if ever called with several cities.
function yoyFor(monthKey, metric){
  const cities = selectedCities();
  if(cities.length !== 1) return null;
  return (DATA[monthKey][cities[0]].yoy || {})[metric] || null;
}

    ${weeklyCompareChartSvg(curWeekly, prevWeekly, state.month, prevMonth || '', yoy ? yoy.weeklyAvg2025 : null, suffix.replace(/[^a-zA-Zа-яА-Я0-9]/g,''), fmtRubShort)}

// ---------- KPI strip: headline cards with sparklines ----------
function sparklineSvg(values, w, h, color){
  const vals = values.filter(v => v != null && isFinite(v));
  if(vals.length < 2) return '';
  const max = Math.max(...vals), min = Math.min(...vals, 0);
  const range = (max-min) || 1;
  const step = w/(vals.length-1);
  const pts = vals.map((v,i) => [i*step, h - ((v-min)/range)*h*0.86 - h*0.07]);
  const line = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w.toFixed(1)},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="${color}" opacity="0.14" stroke="none"></path>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${color}"></circle>
  </svg>`;
}

function kpiCard(label, value, sub, deltaPct, invertGood, sparkVals, color){
  let deltaHtml = '';
  if(deltaPct != null && isFinite(deltaPct)){
    const isGood = invertGood ? deltaPct <= 0 : deltaPct >= 0;
    deltaHtml = `<span class="kpi-delta ${isGood?'up':'down'}">${deltaPct>=0?'+':''}${deltaPct.toFixed(0)}%</span>`;
  }
  return `<div class="kpi-card">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value-row"><span class="kpi-value">${value}</span>${deltaHtml}</div>
    <div class="kpi-sub">${sub}</div>
    ${sparklineSvg(sparkVals, 220, 32, color)}
  </div>`;
}

function renderKpiStrip(){
  const el = document.getElementById('kpiStrip');

  const rev = sumMetric(state.month, ['total','revenue']);
  const revSpark = MONTHS.flatMap(m => weeklyAggregate(m,'revenue'));
  const revDelta = rev.plan>0 ? (rev.fact/rev.plan-1)*100 : null;

  const conv = weightedRate(state.month, ['total','convToBooking'], ['total','leadsRequired']);
  const convSpark = MONTHS.map(m => weightedRate(m, ['total','convToBooking'], ['total','leadsRequired']).fact*100);
  const convDelta = conv.plan>0 ? (conv.fact/conv.plan-1)*100 : null;

  const cancel = weightedRate(state.month, ['total','pctCancel'], ['segments','total','createdCount']);
  const cancelSpark = MONTHS.map(m => weightedRate(m, ['total','pctCancel'], ['segments','total','createdCount']).fact*100);
  const cancelDelta = cancel.plan>0 ? (cancel.fact/cancel.plan-1)*100 : null;

  const checkFor = m => { const s = segTotals(m, ['segments','SEG','currentPeriodCount'], ['segments','SEG','currentPeriodRub']).total; return s.count.fact>0 ? s.rub.fact/s.count.fact : null; };
  const avgCheck = checkFor(state.month);
  const checkSpark = MONTHS.map(checkFor);

  el.innerHTML = [
    kpiCard('Выручка', fmtRubShort(rev.fact), `план ${fmtRubShort(rev.plan)} за месяц`, revDelta, false, revSpark, 'var(--series-1)'),
    kpiCard('Конверсия в бронь', fmtPct(conv.fact*100,1), `план ${fmtPct(conv.plan*100,1)}`, convDelta, false, convSpark, 'var(--series-3)'),
    kpiCard('% отмен', fmtPct(cancel.fact*100,1), `план ${fmtPct(cancel.plan*100,1)}`, cancelDelta, true, cancelSpark, 'var(--critical)'),
    kpiCard('Средний чек', fmtRubShort(avgCheck), 'текущий период', null, false, checkSpark, 'var(--series-2)'),
  ].join('');
}

  `;

function segTotals(monthKey, countPath, rubPath){
  const out = {};
  ['total','repeat','new'].forEach(seg => {
    const cp = countPath.map(p => p==='SEG'?seg:p);
    const rp = rubPath.map(p => p==='SEG'?seg:p);
    out[seg] = { count: sumMetric(monthKey, cp), rub: sumMetric(monthKey, rp) };
  });
  return out;
}

// A single bar split into "Новые"/"Постоянные" segments -- same colour convention as the other
// CARS&GO dashboards (series-1 blue = Новые, series-2 orange = Постоянные). Always shows the
// explicit % share in the legend, not just the proportional bar -- eyeballing a bar isn't a
// number.
function newRepeatStackHtml(newVal, repeatVal, newLabel, repeatLabel){
  const total = (newVal||0) + (repeatVal||0) || 1;
  const nPct = (newVal||0)/total*100, rPct = (repeatVal||0)/total*100;
  return `
    <div class="stack-bar">
      <div class="seg" style="width:${nPct}%; background:var(--series-1);"></div>
      <div class="seg" style="width:${rPct}%; background:var(--series-2);"></div>
    </div>
    <div class="stack-legend">
      <span><span class="sw" style="background:var(--series-1);"></span>${newLabel} · <b>${fmtPct(nPct,0)}</b></span>
      <span><span class="sw" style="background:var(--series-2);"></span>${repeatLabel} · <b>${fmtPct(rPct,0)}</b></span>
    </div>
  `;
}

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile" style="flex:1; min-width:220px;">
        <div class="stat-label">% отмен (факт/план)</div><div class="stat-value">${fmtPct(cancel.fact*100,1)}</div><div class="stat-sub">план ${fmtPct(cancel.plan*100,1)}</div>
        ${gauge(cancel.fact, cancel.plan)}
      </div>
      <div class="stat-tile" style="flex:1; min-width:220px;">
        <div class="stat-label">% будущих броней (факт/план)</div><div class="stat-value">${fmtPct(future.fact*100,1)}</div><div class="stat-sub">план ${fmtPct(future.plan*100,1)}</div>
        ${gauge(future.fact, future.plan)}
      </div>
    </div>
  `;
}

function renderChannels(suffix){
  const el = document.getElementById('m-channels'+suffix);
  const cities = selectedCities();
  if(!cities.length){ el.innerHTML='<div class="empty-note">Выберите хотя бы один город</div>'; return; }
  const totals = {};
  cities.forEach(c => {
    const chans = DATA[state.month][c].channels;
    Object.entries(chans).forEach(([name, v]) => {
      if(!totals[name]) totals[name] = 0;
      totals[name] += v.fact || 0;
    });
  });
  const allRows = Object.entries(totals).map(([name,fact]) => ({name, fact})).filter(r=>r.fact>0).sort((a,b)=>b.fact-a.fact);
  const sumAll = allRows.reduce((a,r)=>a+r.fact,0);
  const CAP = 10;
  const rows = allRows.slice(0, CAP);
  const tailCount = allRows.length - rows.length;
  const tailSum = allRows.slice(CAP).reduce((a,r)=>a+r.fact,0);
  const maxV = Math.max(...rows.map(r=>r.fact), 1);
  el.innerHTML = rows.length ? `
    <div class="chan-list">
      ${rows.map(r => `
        <div class="chan-row">
          <span class="chan-name">${r.name}</span>
          <div class="chan-bar-track"><div class="chan-bar-fill" style="width:${r.fact/maxV*100}%;"></div></div>
          <span class="chan-val"><b>${fmtNum(r.fact)}</b> · ${fmtPct(r.fact/sumAll*100,0)}</span>
        </div>
      `).join('')}
    </div>
    ${tailCount>0 ? `<div class="mom-note">и ещё ${tailCount} каналов поменьше — суммарно ${fmtNum(tailSum)} лидов</div>` : ''}
    <div class="mom-note">Всего по показанным каналам: <b>${fmtNum(sumAll)}</b> лидов</div>
  ` : '<div class="empty-note">Нет данных по лидам за этот месяц</div>';
}

function renderCheck(suffix){
  const el = document.getElementById('m-check'+suffix);
  const segs = segTotals(state.month, ['segments','SEG','currentPeriodCount'], ['segments','SEG','currentPeriodRub']);
  const avg = seg => seg.count.fact>0 ? seg.rub.fact/seg.count.fact : NaN;
  const avgPlan = seg => seg.count.plan>0 ? seg.rub.plan/seg.count.plan : NaN;
  const newV = avg(segs.new), repV = avg(segs.repeat);
  const maxV = Math.max(newV||0, repV||0, 1);
  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile"><div class="stat-label">Общий (факт)</div><div class="stat-value">${fmtRubShort(avg(segs.total))}</div><div class="stat-sub">план ${fmtRubShort(avgPlan(segs.total))}</div></div>
    </div>
    <div class="hint" style="margin:12px 0 0;">Новые vs постоянные</div>
    <div class="mcompare" style="height:56px;">
      <div class="mc-col"><div class="mc-val">${fmtRubShort(newV)}</div><div class="mc-bar current" style="height:${Math.max(4,(newV||0)/maxV*100)}%; background:var(--series-1);"></div><div class="mc-lbl">Новые</div></div>
      <div class="mc-col"><div class="mc-val">${fmtRubShort(repV)}</div><div class="mc-bar" style="height:${Math.max(4,(repV||0)/maxV*100)}%; background:var(--series-2);"></div><div class="mc-lbl">Постоянные</div></div>
    </div>
  `;
}

function renderCostCards(suffix){
  const cpl = weightedRate(state.month, ['total','costPerLead'], ['total','leadsRequired']);
  const cplRatio = cpl.plan>0 ? cpl.plan/cpl.fact : NaN; // lower fact cost than plan is good -> invert
  const cpb = weightedRate(state.month, ['total','costPerBooking'], ['segments','total','createdCount']);
  const cpbRatio = cpb.plan>0 ? cpb.plan/cpb.fact : NaN;
  const row = (name, pf, ratio) => `
    <div class="mini-row">
      <span class="mini-metric-name">${name}</span>
      <span><span class="mini-label">План</span> <b>${fmtRub(pf.plan)}</b></span>

      <span class="status-pill sm ${statusFor(ratio)}">${fmtPct(ratio*100,0)}</span>
    </div>
  `;
  document.getElementById('m-costs'+suffix).innerHTML = row('Лид', cpl, cplRatio) + row('Бронирование', cpb, cpbRatio);
}

// Short auto-generated per-city takeaway -- every number in it is read from state already
// computed elsewhere on the page (pace ratio, conversion, cancel rate, YoY delta, new/repeat
// split), never a fresh estimate, same "no invented numbers" rule as everywhere else in this file.
function cityInsightHtml(city){
  // Rank first, since cityPaceRatio() toggles cityRenderCtx per-city internally and resets it to
  // null when done -- restore the single-city scope afterwards for the rest of this function.
  const ranked = [...CITIES].sort((a,b) => cityPaceRatio(b) - cityPaceRatio(a));
  const rank = ranked.indexOf(city) + 1;
  cityRenderCtx = city;

  const rev = sumMetric(state.month, ['total','revenue']);
  const frac = elapsedFraction(state.month);
  const paceTarget = rev.plan*frac;
  const ratio = paceTarget>0 ? rev.fact/paceTarget : (rev.fact>0?1:0);

  const conv = weightedRate(state.month, ['total','convToBooking'], ['total','leadsRequired']);
  const cancel = weightedRate(state.month, ['total','pctCancel'], ['segments','total','createdCount']);
  const yoy = yoyFor(state.month, 'revenue');

  const cur = segTotals(state.month, ['segments','SEG','currentPeriodCount'], ['segments','SEG','currentPeriodRub']);
  const curTotalRub = (cur.new.rub.fact||0) + (cur.repeat.rub.fact||0);
  const newPct = curTotalRub>0 ? (cur.new.rub.fact||0)/curTotalRub*100 : null;

  const paceSentence = `По выручке город идёт с темпом <b>${fmtPct(ratio*100,0)}</b> от плана на сегодня — ${fmtRubShort(rev.fact)} факта против ${fmtRubShort(paceTarget)} по графику на эту дату (весь план на месяц ${fmtRubShort(rev.plan)}).`;
  const rankSentence = `Это ${rank}-е место по темпу выручки среди ${CITIES.length} городов.`;
  const convSentence = `Конверсия в бронь — ${fmtPct(conv.fact*100,1)}, отмены — ${fmtPct(cancel.fact*100,1)}.`;
  const yoySentence = (yoy && yoy.deltaPct!=null)
    ? `К этому же периоду ${state.month.replace('2026','2025')} выручка ${yoy.deltaPct>=0?'выросла':'просела'} на <b class="${yoy.deltaPct>=0?'up':'down'}">${yoy.deltaPct>=0?'+':''}${(yoy.deltaPct*100).toFixed(1)}%</b>.`
    : `Сравнения с 2025 годом по выручке для этого месяца нет — РНП его не даёт.`;
  const segSentence = newPct!=null
    ? `В выручке текущего периода <b>${fmtPct(newPct,0)}</b> приходится на новых клиентов, остальное — на постоянных.`
    : `Разбивки на новых/постоянных клиентов за текущий период пока нет.`;

  cityRenderCtx = null;
  return `<div class="city-insight">${paceSentence} ${rankSentence} ${convSentence} ${yoySentence} ${segSentence}</div>`;
}

function cityPaceRatio(city){
  cityRenderCtx = city;
  const rev = sumMetric(state.month, ['total','revenue']);
  const target = rev.plan * elapsedFraction(state.month);
  const ratio = target>0 ? rev.fact/target : (rev.fact>0?1:0);
  cityRenderCtx = null;
  return ratio;
}

function renderCityHead(city){
  cityRenderCtx = city;
  const suf = '-'+city;

  const status = statusFor(ratio);
  const conv = weightedRate(state.month, ['total','convToBooking'], ['total','leadsRequired']);

const expandedCities = new Set(); // survives re-render (e.g. switching months) so open cards stay open

function renderCityCards(){
  const el = document.getElementById('cityCards');
  // Worst pace first -- a manager scanning top-to-bottom sees the cities that need attention
  // before the ones already on track.
  const order = [...CITIES].sort((a,b) => cityPaceRatio(a) - cityPaceRatio(b));
  el.innerHTML = order.map(cityCardShellHtml).join('');
  order.forEach(city => {
    renderCityHead(city);
    if(expandedCities.has(city)){
      renderCityDetail(city);
      document.getElementById('cityBody-'+city).hidden = false;
      el.querySelector(`[data-city-toggle="${city}"] .chevron`).textContent = '▾';
    }
  });
  el.querySelectorAll('[data-city-toggle]').forEach(btn => {
    btn.onclick = () => {
      const city = btn.dataset.cityToggle;
      const body = document.getElementById('cityBody-'+city);
      const opening = body.hidden;
      body.hidden = !body.hidden;
      btn.querySelector('.chevron').textContent = body.hidden ? '▸' : '▾';
      if(opening){ expandedCities.add(city); renderCityDetail(city); }
      else{ expandedCities.delete(city); }
    };
  });
}

}

    '<b>Темп:</b> факт месяца делится на (план × доля прошедших дней месяца) — так август (несколько дней от начала) сравнивается с планом на весь месяц корректно.<br>' +
    '<b>% отмен / % будущих броней:</b> в РНП эти проценты считаются только по городу в целом — разбивки на новых/постоянных клиентов в источнике нет, поэтому здесь она не показана.<br>' +
    '<b>Лиды по каналам:</b> сумма по показанным каналам не всегда совпадает с собственной строкой «Проверка» в РНП — это расхождение существует в самой исходной таблице (одни каналы то учитываются, то нет), не ошибка подсчёта здесь.<br>' +
    '<b>Города:</b> только 6 городов из шести листов «(Воронка)», совпадающих с остальными дашбордами CARS&amp;GO — Алматы/Астана/Горно-Алтайск (другие листы РНП) не включены.<br>' +
    '<b>Недели на графике выручки:</b> границы недель — как в РНП (не календарные). График сравнивает выбранный месяц с предыдущим по номеру недели (неделя 1 к неделе 1 и т.д.), а не показывает месяцы подряд на одной шкале. Для июля сравнивать не с чем (июня в РНП нет) — линия одна. Для минимум одного города/месяца сумма недель в источнике не сходилась с итоговым «факт» ровно — такие недели пропорционально досчитаны до факта месяца; форма (какая неделя сильнее/слабее) сохранена, копейки — нет.<br>' +
    '<b>Доля новых/повторных в выручке:</b> считается не от той же цифры, что недельный график (там — общий план/факт компании), а от выручки броней текущего периода — это единственная строка в РНП, где источник сам делит выручку на новых и постоянных клиентов.';
